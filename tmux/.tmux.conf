# ============= SETUP =============

set -g default-terminal "tmux-256color"

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


# ============= SETTINGS =============

# Show info messages for a longer time.
set -g display-time 2000

# Show pane numbers (prefix q) for longer.
set -g display-panes-time 3000

# Allow ~unlimited scrollback in panes.
set -g history-limit 1000000000

# Persist command prompt history across server restarts (written when the server exits).
run 'mkdir -p -m 700 ~/.local/state/tmux'
set -s history-file ~/.local/state/tmux/history
set -s prompt-history-limit 10000  # Up from 100, same as Vim's `history`.

# Use vi copy mode and readline command mode editing.
set -g mode-keys vi
set -g status-keys emacs

# Enable mouse support.
set -g mouse on

# Allow Esc to cancel a selection while staying in copy mode.
bind -T copy-mode-vi Escape if-shell -F "#{selection_present}" "send-keys -X clear-selection" "send-keys -X cancel"

# Allow iTerm inline images (`imgcat`) to work.
set -g allow-passthrough on

# Get rid of delay from Esc (needed for Vim meta key mappings)
set -s escape-time 0

# Enable passing modified special keys to apps that ask for them.
# (Needed to make Ctrl-Enter work in `aven`.)
set -s extended-keys on
set -s extended-keys-format csi-u

# Switch to another session instead of detaching when the current one is destroyed.
set -g detach-on-destroy off

# Start window numbers from 1 and remove number gaps when closing windows.
set -g base-index 1
set -g renumber-windows on
bind 0 select-window -t :=10

# Make Vim `set autoread` work.
set -g focus-events on

# Use the terminal's own colours instead of tmux's built-in theme.
set -s theme terminal
# Also keep the terminal background for these instead of the theme's grey.
set -g popup-style default
set -g popup-border-style default
set -g menu-style default
set -g menu-border-style default
set -g pane-border-style default
# (The old default, as the new one makes the marked pane's border magenta.)
set -g pane-active-border-style '#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=green}}'
set -g fill-character ''
set -g display-panes-border-style default
set -g tree-mode-border-style default

# Make the active window stand out more in status bar.
set -g window-status-current-style reverse

# Update status bar 7.5x more often.
set -g status-interval 2

# Show full session name in status bar.
set -g status-left-length 99

# Show program title in the iTerm2 title bar.
set -g set-titles on
set -g set-titles-string '#T'

# Show UTC date in status bar only when the whole thing (20 chars) fits without squeezing the window list.
# (The free space is computed at render time as: client width - status-left width - window list width.)
set -g @datetime-utc '#(gdate --utc "+%%a %%Y-%%m-%%d %%H:%%M")'
set -g @status-right-space '#{e|-|:#{e|-|:#{client_width},#{w;T:status-left}},#{w:#{W:#{T:window-status-format}#{?window_end_flag,,#{window-status-separator}},#{T:window-status-current-format}#{?window_end_flag,,#{window-status-separator}}}}}'
set -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}#{?#{e|<:#{E:@status-right-space},20},,#{T:@datetime-utc}}'


# ============= MAPPINGS =============

# Make these easier to use (matches similar remapping logic in Vim)
bind , command-prompt
bind C-, command-prompt  # For consistency, not actually sent by iTerm.
bind . last-pane
# (Not `{ rename-window "%%" }`, as tmux escapes `%%` for single quotes.)
bind \; command-prompt -I "#W" "rename-window -- '%%'"
bind : command-prompt { move-window -t "%%" }

# Rename the current window after the directory or Git branch name.
bind C-d rename-window "#{b:pane_current_path}"
# (`q:` to quote the path for the shell, as a directory name can contain anything.)
bind C-g run-shell 'branch=$(git -C #{q:pane_current_path} branch --show-current 2> /dev/null); [ -n "$branch" ] && tmux rename-window "$branch" || tmux display-message "Not on a Git branch"'

# Rename the current window after the _active_ pane's terminal title, kebab-cased.
# (`q:` to quote the title for the shell, as anything running in the pane can set it.)
bind C-a run-shell 'name=$(kebab #{q:pane_title}); [ -n "$name" ] && tmux rename-window "$name" || tmux display-message "Empty pane title"'

# Simplify resizing panes.
# (The default meta-arrow-mappings don't work with iTerm2 word-moving override.)
bind -r Left resize-pane -L 1
bind -r Down resize-pane -D 1
bind -r Up resize-pane -U 1
bind -r Right resize-pane -R 1
bind -r C-Left resize-pane -L 5
bind -r C-Down resize-pane -D 5
bind -r C-Up resize-pane -U 5
bind -r C-Right resize-pane -R 5
unbind M-Left
unbind M-Down
unbind M-Up
unbind M-Right

# Equalize pane splits.
bind = select-layout -E \; run-shell -b "workmux _sidebar-reflow --window #{window_id} 2> /dev/null || true"

# Remap away from `=`.
bind \" choose-buffer -Z

# Open new panes more easily.
bind H split-window -h -c "#{pane_current_path}" -b
bind J split-window -v -c "#{pane_current_path}"
bind K split-window -v -c "#{pane_current_path}" -b
bind L split-window -h -c "#{pane_current_path}"
bind Y split-window -h -f -c "#{pane_current_path}" -b
bind U split-window -v -f -c "#{pane_current_path}"
bind I split-window -v -f -c "#{pane_current_path}" -b
bind O split-window -h -f -c "#{pane_current_path}"

# Swap current pane with one chosen from the pane-number overlay.
bind h display-panes -d 0 "swap-pane -d -t '%%'"

# Move current pane next to a chosen pane (prefix j, then h/j/k/l, then pane number).
bind j switch-client -T movepane
bind -T movepane h display-panes -d 0 "move-pane -h -b -t '%%'"
bind -T movepane j display-panes -d 0 "move-pane -v    -t '%%'"
bind -T movepane k display-panes -d 0 "move-pane -v -b -t '%%'"
bind -T movepane l display-panes -d 0 "move-pane -h    -t '%%'"

# Remap away from `L`.
bind B switch-client -l

# Open new windows in the current directory.
bind c new-window -c "#{pane_current_path}"
# Open it right after the current window instead of as the last one.
bind C-c new-window -a -c "#{pane_current_path}"

# Make this more logical with `B` for last session (and avoid mistypings).
bind -r b last-window
bind -r C-b last-window

# Allow repeating these.
bind -r n next-window
bind -r C-n next-window
bind -r p previous-window
bind -r C-p previous-window

# Easier zoom and unzoom.
bind -r - resize-pane -Z
bind -r C-_ resize-pane -Z  # If host terminal wouldn't support extkeys.
bind -r C-- resize-pane -Z

# Hide/toggle the status bar.
bind C-h set status

# Zoom pane to full vertical height.
# (Leaves `command-prompt { find-window -Z "%%" }` unmapped)
bind f run-shell "~/dotfiles/tmux/tmux-vzoom.sh"

# Toggle wide iTerm2 side margins.
bind C-m run-shell -b "~/dotfiles/tmux/tmux-iterm-focus.sh"

bind z display-popup -EE "~/dotfiles/tmux/tmux-zoxide-window"
# Open it right after the current window instead of as the last one.
# (Replaces the default `suspend-client`, which just hangs the terminal as `sh/.bashrc` `exec`s tmux.)
bind C-z display-popup -EE "~/dotfiles/tmux/tmux-zoxide-window -a"

# Remap away from `-`.
bind Z delete-buffer

# Vim-like copy mode.
bind v copy-mode
bind C-u copy-mode \; send-keys -X halfpage-up
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v if-shell -F '#{selection_present}' { send-keys -X rectangle-toggle } { send-keys -X begin-selection ; send-keys -X rectangle-toggle }
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y send-keys -X begin-selection \; send-keys -X end-of-line \; send-keys -X cursor-left \; send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down
bind -T copy-mode-vi C-b send-keys -X page-up
bind -T copy-mode-vi C-f send-keys -X page-down

# Jump between shell prompts (marked by `PS1` in `sh/.bashrc`), like Vim paragraph motions.
bind -T copy-mode-vi \{ send-keys -X previous-prompt
bind -T copy-mode-vi \} send-keys -X next-prompt
# (Replaces the default `swap-pane -U`/`-D`, which `h` above does better.)
bind \{ copy-mode \; send-keys -X previous-prompt
unbind \}

# Search incrementally, like Vim's `incsearch`.
bind -T copy-mode-vi / command-prompt -Pi -T search -p "(search down)" { send-keys -X search-forward-incremental -- "%%" }
bind -T copy-mode-vi ? command-prompt -Pi -T search -p "(search up)" { send-keys -X search-backward-incremental -- "%%" }
# Search upwards straight away. (Replaces the default `describe-key`, `Q` lists all mappings.)
bind / copy-mode \; send-keys ?

# Session manager.
bind s display-popup -EE -w 80% -h 80% "mux"

# Remap away from `s`.
bind S choose-tree -Zs

# Easily copy command output from (other) panes.
bind y display-popup -EE -w 75% -h 75% "tmux-snaglord"

# Git commit browser.
bind g display-popup -EE -w 80% -h 80% -d "#{pane_current_path}" "gg"
bind G display-popup -EE -w 80% -h 80% -d "#{pane_current_path}" "gg --branches --tags --remotes"

# Open Bash in a popup.
bind t display-popup -EE -w 75% -h 75%

# Remap away from `t`.
bind T clock-mode

# Clear scrollback history - mapped into iTerm Cmd-K.
set -g user-keys[0] "\e[1107~"
bind User0 send-keys C-l \; run-shell 'sleep 0.3s' \; clear-history

# Check what keys are mapped to.
bind Q list-keys -T prefix

# Navigate to most recent agent.
bind -r l run-shell "workmux last-done"

# Open workmux dashboard.
bind W display-popup -h 70% -w 80% -EE "workmux dashboard"

# Toggle workmux sidebar.
bind % run-shell "workmux sidebar"

# Quick task capture.
bind a display-popup -EE -w 80 -h 20 -d "#{pane_current_path}" "aven tui --add-task-only"

# Task manager.
bind A display-popup -EE -w 100% -h 100% -d "#{pane_current_path}" "aven tui --view all --layout columns"

# Edit and create notes.
# (Not using `-EE` so that a reflex `:cq` Vim exit still closes the popup.)
bind e display-popup -E -w 100% -h 100% "zk edit --interactive --sort modified-"
bind E command-prompt -p "new note:" { display-popup -E -w 100% -h 100% "zk n %%" }
# (`E` was `select-layout -E`, which `=` above already does.)


# ============= NO PREFIX MAPPINGS =============

bind -n C-S-Left swap-window -d -t -1
bind -n C-S-Right swap-window -d -t +1

# File picker: pass through to fzf in bash, otherwise open tmux file picker.
bind -n C-t if-shell -F '#{m:bash,#{pane_current_command}}' \
    'send-keys C-t' \
    'display-popup -EE -w 75% -h 75% "TMUX_FILE_PICKER_FD_FLAGS=\"$FZF_FD_FLAGS\" ~/dotfiles/tmux/tmux-file-picker"'
bind C-t send-keys C-t  # Also mapped into iTerm Cmd-T.

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
# Also prevents navigational pane wrapping.
%hidden vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
%hidden is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind -n M-h if-shell "$is_vim" { send-keys M-h } { if-shell -F '#{pane_at_left}'   {} { select-pane -L } }
bind -n M-j if-shell "$is_vim" { send-keys M-j } { if-shell -F '#{pane_at_bottom}' {} { select-pane -D } }
bind -n M-k if-shell "$is_vim" { send-keys M-k } { if-shell -F '#{pane_at_top}'    {} { select-pane -U } }
bind -n M-l if-shell "$is_vim" { send-keys M-l } { if-shell -F '#{pane_at_right}'  {} { select-pane -R } }
bind M-h send-keys M-h
bind M-j send-keys M-j
bind M-k send-keys M-k
bind M-l send-keys M-l
# Shift-Enter - mapped in iTerm like this.
# Vim gets the raw sequence so it can tell Shift-Enter apart from Enter, everything else just gets a plain Enter.
%hidden shift_enter="\e[2013~"
set -g user-keys[1] "$shift_enter"
bind -n User1 if-shell "$is_vim" { send-keys -l "$shift_enter" } { send-keys Enter }
# Ctrl-Enter - iTerm sends it as CSI u, which tmux only passes on to apps that request extended keys.
# Vim doesn't, but understands the raw sequence.
bind -n C-Enter if-shell "$is_vim" { send-keys -l "\e[13;5u" } { send-keys C-Enter }

bind -T copy-mode-vi M-h if-shell -F '#{pane_at_left}'   {} { select-pane -L }
bind -T copy-mode-vi M-j if-shell -F '#{pane_at_bottom}' {} { select-pane -D }
bind -T copy-mode-vi M-k if-shell -F '#{pane_at_top}'    {} { select-pane -U }
bind -T copy-mode-vi M-l if-shell -F '#{pane_at_right}'  {} { select-pane -R }


# ============= HOOKS =============

# Clear the hostname that tmux sets as the default pane title for new panes.
# (A single space, not an empty string as tmux-resurrect wouldn't work otherwise.)
set-hook -g after-new-session 'select-pane -T " "'
set-hook -g after-new-window 'select-pane -T " "'

# Keep the pane title from ever becoming truly empty, as that breaks tmux-resurrect.
set-hook -g pane-title-changed 'if -F "#{==:#{pane_title},}" "select-pane -T \" \""'

# Turn a `notify:<message>` pane title into a macOS notification that switches to the pane when clicked.
# Otherwise remember the title, so that it can be restored after a notification.
# Use the title from the hook, as the pane may have changed it again by the time the hook runs.
set-hook -ga pane-title-changed 'if -F "#{m:notify:*,#{hook_new_title}}" "run-shell -b \"~/dotfiles/tmux/tmux-notify.sh #{hook_pane} #{q:hook_new_title}\"" "set -pF @title \"#{hook_new_title}\""'

# Rebalance panes on pane close/split, then ask workmux to restore a possible sidebar to its configured width.
# A floating pane (`prefix *`) lives outside the layout, but `new-pane` shares its
# implementation with `split-window` and fires `after-split-window` all the same, so skip the rebalance for one.
set-hook -g pane-exited        'select-layout -E ; run-shell -b "workmux _sidebar-reflow --window #{window_id} 2> /dev/null || true"'
set-hook -g after-split-window 'select-pane -T " " ; if -F "#{pane_floating_flag}" {} { select-layout -E ; run-shell -b "workmux _sidebar-reflow --window #{window_id} 2> /dev/null || true" }'
# (Not setting the behavior on `prefix x` so that it can be used to override this.)


# ============= PLUGINS =============

set -g @plugin 'Morantron/tmux-fingers'  # vim-easymotion style copy mode hints.
set -g @fingers-key [
bind -T copy-mode-vi [ run-shell -b "#{@fingers-cli} start #{pane_id}"
bind C-[ run-shell -b "#{@fingers-cli} start #{pane_id}"
set -g @fingers-jump-key k
bind C-k run-shell -b "#{@fingers-cli} start --mode jump #{pane_id}"
# Highlight GitHub PR references (org/repo#1234 and #1234).
set -g @fingers-pattern-0 '[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+#[0-9]+'
set -g @fingers-pattern-1 '#[0-9]+'
# Highlight compiler/grep style file locations (path/to/file:12, file.py:12:5) whole.
set -g @fingers-pattern-2 '[.\w~$@/-]*(/[.\w@-]+|\.[A-Za-z]\w*):[0-9]+(:[0-9]+)?'
# Highlight file names in `ll` (see sh/.bashrc) output, unquoted and without the `--classify` suffix.
# (`\x27` is a `'`, `(?|` lets both alternatives reuse the same `match` group.)
set -g @fingers-pattern-3 '[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2} +(?|\x27(?<match>[^\x27]+)\x27|(?<match>\S+?)[*@|=]?(?=\s|$))'
# Smart main action: open URLs and PRs in browser, show commit hashes in a popup,
# edit files in $EDITOR in a split.
# (This won't expand a ~)
set -g @fingers-main-action "$HOME/dotfiles/tmux/tmux-fingers-action.sh"
# Move the default copy to the system clipboard to Alt.
set -g @fingers-alt-action ':copy:'
# Binary is managed via Brew, so skip the plugin's own install/update wizard
# which nags whenever the Brew binary version drifts from the plugin version.
set -g @fingers-skip-wizard 1

set -g @plugin 'tmux-plugins/tmux-resurrect'  # Save and restore sessions across restarts.
# (Binds `prefix C-s` to save and `prefix C-r` to restore.)

set -g @plugin 'tmux-plugins/tmux-continuum'  # Drives resurrect automatically.
# (Keep as the last plugin so its `status-right` hook isn't overridden. Note: `prefix C-h` pauses it when the statusline is hidden.)
# Autosave every 15 minutes and restore the last saved environment on server start.
set -g @continuum-restore 'on'

# tpack itself is installed via Brew. Unbind all its mappings.
set -g @tpack-install 'M-t'
set -g @tpack-update  'M-t'
set -g @tpack-clean   'M-t'
set -g @tpack-tui     'M-t'
# Report available plugin updates instead of applying them silently ('auto' to apply).
set -g @tpack-update-mode 'prompt'
set -g @tpack-update-interval '24h'

# Install any missing plugins on a fresh machine, then load them,
# silencing its messages about already installed plugins.
run -E 'tpack install > /dev/null'
run 'tpack init'

# Unbind the now-shadowed mappings.
unbind M-t
