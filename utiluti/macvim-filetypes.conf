# File types associated with MacVim by setup.sh via `utiluti`. One UTI per line.
#
# Identifiers come from the Launch Services registry (`lsregister -dump`), which
# disagrees with Apple's documentation on several names. Resolution is
# leaf-first, so parent types don't cascade: every leaf needs its own line.
#
# Not listed on purpose:
#   public.html   Welded to http/https; setting it independently fails.
#   public.data   The type of every leading-dot file (.gitignore, .env), which
#                 have no extension as far as Launch Services is concerned.
#                 Rejected with paramErr (-50) — Apple appears to deny overrides
#                 on the universal fallback. Use `open -t` for those instead.
#   public.item, public.content, public.folder, public.directory,
#   public.executable, com.apple.application-bundle
#                 Roots spanning folders and .app bundles. Never add these.


# --- Plain text ---
public.text
public.plain-text
public.utf8-plain-text

# --- Generic source ---
public.source-code
public.script

# --- Shells ---
public.shell-script
public.bash-script
public.zsh-script
public.csh-script
public.ksh-script
public.tcsh-script

