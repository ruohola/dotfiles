# --- TypeScript ---
# macOS maps .ts to the MPEG-2 transport stream video type, so that UTI is what
# makes .ts open in MacVim — don't "fix" it. Cost: real transport streams open
# in MacVim too. com.microsoft.typescript covers .tsx and isn't redundant.
public.mpeg-2-transport-stream
com.microsoft.typescript
