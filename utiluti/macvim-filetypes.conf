# File types associated with MacVim by setup.sh via `utiluti`. One UTI per line.
#
# Derived mechanically: every type conforming to public.text in the Launch
# Services registry (`lsregister -dump`), minus the exclusions below. Regenerate
# after installing anything that declares new types. Identifiers come from the
# registry, not Apple's documentation, which disagrees on several names.
#
# Resolution is leaf-first, so parent types don't cascade — every leaf needs its
# own line, and a type only routes to MacVim once an override exists for it.
#
# Excluded on purpose:
#   Binary despite conforming to text  .class, .scpt
#   Must launch rather than open       .command, .mobileconfig, .provisionprofile, .jnlp
#   Media, fonts, archives, packages, playlists, contacts, calendars
#   Owned by a better editor           .xib, .storyboard, .pbxproj, .keylayout, csv/tsv, logs
#   App data rather than source        Alfred, Keyboard Maestro, Evernote, GPX, PostScript, Xcode logs
#   public.html                        Welded to http/https; setting it independently fails.
#   public.data                        The type of every leading-dot file (.gitignore, .env), which
#                                      have no extension as far as Launch Services is concerned.
#                                      Rejected with paramErr (-50). Use `open -t` for those.
#   public.item, public.content, public.folder, public.executable, com.apple.application-bundle
#                                      Roots spanning folders and .app bundles. Never add these.

